events {
    worker_connections 1024;
}

http {
    upstream account_service {
        server account-service:3001;
    }

    upstream ride_service {
        server ride-service:3000;
    }

    server {
        listen 8080;

        # Roteamento para Account Service
        location /api/accounts/ {
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Roteamento para Ride Service (REST)
        location /api/rides {
            proxy_pass http://ride_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Roteamento WebSocket (ActionCable)
        location /cable {
            proxy_pass http://ride_service/cable;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Healthcheck do Gateway
        location /health {
            return 200 '{"status":"UP","gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
