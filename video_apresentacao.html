        text: "Em resumo, o TransportManager entrega uma solução completa, com foco em tempo real, consistência transacional e separação estrita de responsabilidades entre microsserviços. O código está versionado e pronto para deploy com Docker Compose. Agradeço imensamente a atenção de todos os avaliadores da PGE-CE e fico à inteira disposição para quaisquer esclarecimentos. Muito obrigado!",
        renderVisual: () => `
          <div class="space-y-4 max-w-lg text-center animate-fade-in">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-3xl">
              🚀
            </div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-white">
              Apresentação Concluída com Sucesso!
            </h2>
            <p class="text-slate-300 text-sm leading-relaxed">
              Solução pronta para avaliação técnica do Processo Seletivo da <strong>PGE-CE</strong>.
            </p>
            <div class="p-3 bg-slate-800/80 border border-slate-700 rounded-xl text-xs text-slate-300 font-mono">
              Repositório: github.com/etevaldojales/tranportmanager
            </div>
          </div>
        `
      }
    ];

    // State
    let currentBlockIndex = 0;
    let isPlaying = false;
    let voiceEnabled = true;
    let playbackSpeed = 1.2;
    let progressInterval = null;
    let currentBlockElapsed = 0;

    // Elements
    const videoDisplay = document.getElementById('video-display');
    const teleprompterText = document.getElementById('teleprompter-text');
    const screenActionHint = document.getElementById('screen-action-hint');
    const badgeBlock = document.getElementById('badge-block');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const btnPlay = document.getElementById('btn-play');
    const playText = document.getElementById('play-text');
    const playIcon = document.getElementById('play-icon');
    const speedSelect = document.getElementById('speed-select');
    const btnToggleVoice = document.getElementById('btn-toggle-voice');
    const voiceStateText = document.getElementById('voice-state-text');
    const audioWave = document.getElementById('audio-wave');

    // Speech Synthesis
    const synth = window.speechSynthesis;
    let currentUtterance = null;

    function renderCurrentBlock() {
      const block = presentationBlocks[currentBlockIndex];
      videoDisplay.innerHTML = block.renderVisual();
      teleprompterText.innerHTML = block.text;
      screenActionHint.innerText = `[Ação na tela]: ${block.action}`;
      badgeBlock.innerText = `BLOCO ${block.id}/6 • ${block.title}`;

      // Update pills
      document.querySelectorAll('.block-pill').forEach((pill, idx) => {
        if (idx === currentBlockIndex) {
          pill.className = 'block-pill px-3 py-1 text-xs rounded-lg bg-emerald-500 text-slate-950 font-bold shadow';
        } else {
          pill.className = 'block-pill px-3 py-1 text-xs rounded-lg text-slate-400 hover:text-white transition';
        }
      });

      updateProgressBar();
    }

    function updateProgressBar() {
      let totalTime = presentationBlocks.reduce((acc, b) => acc + b.durationSec, 0);
      let passedTime = 0;
      for (let i = 0; i < currentBlockIndex; i++) {
        passedTime += presentationBlocks[i].durationSec;
      }
      passedTime += currentBlockElapsed;
      let pct = Math.min(100, (passedTime / totalTime) * 100);
      progressBar.style.width = pct + '%';

      let mins = Math.floor(passedTime / 60);
      let secs = Math.floor(passedTime % 60);
      currentTimeEl.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function speakCurrentBlock() {
      if (!synth || !voiceEnabled) return;
      synth.cancel();

      const block = presentationBlocks[currentBlockIndex];
      currentUtterance = new SpeechSynthesisUtterance(block.text);
      currentUtterance.lang = 'pt-BR';
      currentUtterance.rate = playbackSpeed;

      // Find PT-BR voice if present
      const voices = synth.getVoices();
      const ptVoice = voices.find(v => v.lang.includes('pt') || v.lang.includes('PT') || v.name.includes('Portuguese') || v.name.includes('Brazil'));
      if (ptVoice) {
        currentUtterance.voice = ptVoice;
      }

      currentUtterance.onend = () => {
        if (isPlaying) {
          if (currentBlockIndex < presentationBlocks.length - 1) {
            goToBlock(currentBlockIndex + 1);
            play();
          } else {
            pause();
          }
        }
      };

      currentUtterance.onerror = (e) => {
        console.warn("Speech error or cancelled", e);
      };

      synth.speak(currentUtterance);
    }

    function play() {
      isPlaying = true;
      playText.innerText = "Pausar Vídeo";
      playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      audioWave.classList.remove('opacity-40');

      speakCurrentBlock();

      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        currentBlockElapsed += 0.5 * playbackSpeed;
        const currentDur = presentationBlocks[currentBlockIndex].durationSec;
        if (!voiceEnabled && currentBlockElapsed >= currentDur) {
          if (currentBlockIndex < presentationBlocks.length - 1) {
            goToBlock(currentBlockIndex + 1);
            play();
          } else {
            pause();
          }
        }
        updateProgressBar();
      }, 500);
    }

    function pause() {
      isPlaying = false;
      playText.innerText = "Reproduzir Vídeo";
      playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      audioWave.classList.add('opacity-40');
      if (synth) synth.cancel();
      clearInterval(progressInterval);
    }

    function goToBlock(index) {
      if (synth) synth.cancel();
      currentBlockIndex = Math.max(0, Math.min(presentationBlocks.length - 1, index));
      currentBlockElapsed = 0;
      renderCurrentBlock();
      if (isPlaying) {
        speakCurrentBlock();
      }
    }

    // Event listeners
    btnPlay.addEventListener('click', () => {
      if (isPlaying) pause(); else play();
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      goToBlock(currentBlockIndex - 1);
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      goToBlock(currentBlockIndex + 1);
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      goToBlock(0);
      if (isPlaying) play();
    });

    speedSelect.addEventListener('change', (e) => {
      playbackSpeed = parseFloat(e.target.value);
      if (isPlaying && voiceEnabled) {
        speakCurrentBlock();
      }
    });

    btnToggleVoice.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      if (voiceEnabled) {
        voiceStateText.innerText = 'LIGADA';
        voiceStateText.className = 'text-emerald-400 font-bold';
        audioWave.style.display = 'flex';
        if (isPlaying) speakCurrentBlock();
      } else {
        voiceStateText.innerText = 'MUDO';
        voiceStateText.className = 'text-slate-400 font-bold';
        audioWave.style.display = 'none';
        if (synth) synth.cancel();
      }
    });

    document.getElementById('progress-container').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickRatio = (e.clientX - rect.left) / rect.width;
      const totalTime = presentationBlocks.reduce((acc, b) => acc + b.durationSec, 0);
      const targetTime = totalTime * clickRatio;

      let accumulated = 0;
      for (let i = 0; i < presentationBlocks.length; i++) {
        if (targetTime <= accumulated + presentationBlocks[i].durationSec || i === presentationBlocks.length - 1) {
          goToBlock(i);
          currentBlockElapsed = Math.max(0, targetTime - accumulated);
          updateProgressBar();
          break;
        }
        accumulated += presentationBlocks[i].durationSec;
      }
    });

    // Populate voices on start
    if (synth) {
      synth.onvoiceschanged = () => { synth.getVoices(); };
    }

    // Init
    renderCurrentBlock();
  </script>
</body>
</html>
